<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Walcer Family</title>
<style>
  :root { color-scheme: light dark; --bg:#faf8f5; --fg:#2b2b2b; --muted:#6b6b6b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1b1a; --fg:#ece9e4; --muted:#a19d97; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); }
  body { display:flex; align-items:center; justify-content:center; padding:16px;
         font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; }
  main { max-width: 36rem; text-align:center; }
  h1 { font-weight: normal; font-size: 2.25rem; margin: 0 0 .5rem; letter-spacing: .02em; }
  p { color: var(--muted); line-height: 1.6; margin: 0; }
  a { color: inherit; text-underline-offset: .2em; }
</style>
</head>
<body>
<main>
  <h1>The Walcer Family</h1>
  <p><a href="/lou/">In memory of Lou Walcer</a></p>
</main>
</body>
</html>
